name: Mutation Testing

on:
  pull_request:
    branches:
      - main

jobs:
  mutation-testing:
    name: Stryker (diff-based)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for --since diff

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Stryker
        run: dotnet tool install --global dotnet-stryker

      - name: Restore dependencies
        run: dotnet restore FxRatesApi.sln

      - name: Compute changed source files
        id: diff
        run: |
          # Get .cs files changed vs main, strip the FxRatesApi.Api/ prefix
          # since Stryker runs from that directory.
          CHANGED=$(git diff --name-only origin/main...HEAD \
            | grep '\.cs$' \
            | grep -v 'Tests/' \
            | grep -v '\.g\.cs$' \
            | sed 's|^FxRatesApi\.Api/||' \
            | tr '\n' ',')
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed files: $CHANGED"

      - name: Run Stryker (changed files only)
        # Runs from FxRatesApi.Api/ so config-relative paths resolve correctly.
        # Changed files are passed via --mutate (computed from git diff above).
        # continue-on-error means survivors are informational and never block merge.
        if: steps.diff.outputs.files != ''
        run: |
          cd FxRatesApi.Api
          dotnet stryker --config-file Tests/FxRatesApi.Api.Tests/stryker-config.json --mutate "${{ steps.diff.outputs.files }}"
        continue-on-error: true

      - name: Find mutation report
        id: report
        run: |
          REPORT=$(find . -name "mutation-report.json" | sort | tail -n 1)
          echo "path=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Post PR comment with survivors
        if: steps.report.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_PATH: ${{ steps.report.outputs.path }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/post-mutation-comment.js
